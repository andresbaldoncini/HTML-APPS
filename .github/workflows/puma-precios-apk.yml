name: Puma Precios APK

on:
  push:
    paths:
      - "puma-precios-android/**"
      - ".github/workflows/puma-precios-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: puma-precios-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk PumaPrecios.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PumaPrecios-apk
          path: puma-precios-android/PumaPrecios.apk

      - name: Publicar en Releases (link fijo para bajar desde el celu)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: puma-precios
          name: Puma Precios (última versión)
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Última compilación: versión 1.0.${{ github.run_number }}
            Bajá **PumaPrecios.apk** desde el celu e instalala.
          files: puma-precios-android/PumaPrecios.apk
